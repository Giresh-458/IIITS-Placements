[pytest]
testpaths = tests
norecursedirs = _backups .* build dist
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
asyncio_mode = auto
markers =
    live_integration: Tests requiring external Docker containers, live PostgreSQL, or running FastAPI daemon (port 8000)
addopts = -m "not live_integration"
